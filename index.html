ativo — vencimentos disponíveis mudam com frequência, não é recomendação de compra)`,itens:[{nome:`Tesouro Selic 2029 (Reserva Imediata) — 33,3%`,detalhe:`Vencimento mais próximo dos três lotes, para minimizar o impacto de variações de taxa no resgate diário. Isento da taxa de custódia da B3 até R$ 10.000 por CPF.`,cor:`var(--sector-selic-reserva)`},{nome:`Tesouro Selic 2029 (Metas de Curtíssimo Prazo) — 33,3%`,detalhe:`Mesmo vencimento do lote de reserva, mas separado para despesas já programadas (IPVA, IPTU, viagens, impostos, reformas) — preserva o valor nominal até a data de uso, sem volatilidade negativa.`,cor:`var(--sector-selic-metas)`},{nome:`Tesouro Selic 2031 (Caixa & Transição de Aportes) — 33,3%`,detalhe:`Vencimento mais distante, trava o prêmio de rentabilidade pós-fixada por um horizonte maior enquanto aguarda oportunidades de mercado ou a transição gradual de aportes para a bolsa.`,cor:`var(--sector-selic-oportunidades)`}]},{titulo:`Onde acompanhar`,itens:[{nome:`Tesouro Direto (site oficial)`,detalhe:`Preço e rentabilidade diária atualizados pelo Tesouro Nacional.`},{nome:`App da sua corretora`,detalhe:`Confirme se a corretora cobra taxa de administração adicional — o ideal é 0%.`}]}],atencao:`O Tesouro Selic quase nunca perde para a poupança e tem liquidez D+0/D+1 — mas ainda paga Imposto de Renda regressivo (começa em 22,5% e cai até 15% após 2 anos) e IOF regressivo nos primeiros 30 dias corridos. Os vencimentos usados nos exemplos acima (2029 e 2031) mudam com o tempo; confira sempre os títulos disponíveis no Tesouro Direto antes de decidir.`,setores:[{label:`Reserva Imediata`,pct:33.3,cor:`var(--sector-selic-reserva)`,fundos:1,unidade:`titulo`,funcao:`Exemplo: Tesouro Selic 2029. Reserva de emergência e resgate curto — foco no vencimento mais próximo para minimizar o impacto de variações de taxa no resgate diário.`},{label:`Metas de Curtíssimo Prazo`,pct:33.3,cor:`var(--sector-selic-metas)`,fundos:1,unidade:`titulo`,funcao:`Exemplo: Tesouro Selic 2029. Caixa para compromissos de 1 a 2 anos — despesas programadas (IPVA/IPTU, viagens, impostos ou reformas), garantindo a preservação nominal do valor.`},{label:`Caixa & Transição de Aportes`,pct:33.4,cor:`var(--sector-selic-oportunidades)`,fundos:1,unidade:`titulo`,funcao:`Exemplo: Tesouro Selic 2031. Caixa de oportunidades de longo prazo — trava o prêmio de rentabilidade pós-fixada por um horizonte maior enquanto aguarda oportunidades de mercado ou transição para a bolsa.`}],notaSetores:`Uma carteira de apenas 3 lotes em Tesouro Selic simplifica ao máximo a gestão de caixa: 66,6% do patrimônio fica no vencimento mais próximo (2029) para urgências e metas imediatas sem sobressaltos, e 33,3% no vencimento mais distante (2031) para otimizar o prêmio pós-fixado de longo prazo e manter munição pronta para oportunidades.`},rt={contexto:`Título público com uma taxa de retorno fixa, definida no momento da compra — você já sabe exatamente quanto vai receber no vencimento, em reais (sempre R$ 1.000,00 por título). É o menor risco de crédito do país, mas assim como nos FIIs, Ações e BDRs, o principal risco a controlar aqui não é escolher "o título certo", e sim não ficar refém de um único vencimento ou de uma única forma de uso — combine prazos curtos, longos, pagamento de renda e movimentos táticos.`,criterios:[`Só faz sentido levar o título até o vencimento coincidir com o seu objetivo — vender antes, com os juros em alta, pode gerar perda (marcação a mercado), assim como no IPCA+.`,`Compare a taxa prefixada oferecida com a expectativa de Selic/CDI para o mesmo período: se a taxa prefixada for menor do que o CDI esperado, pode não compensar o risco de travar a taxa.`,`É mais indicado quando o cenário de juros está em queda (você "trava" uma taxa boa antes que ela caia mais) do que quando os juros estão subindo.`,`Use a mesma régua de diversificação aplicada às Ações, FIIs e BDRs: espalhe a carteira entre vencimentos curtos, longos, títulos com juros semestrais e uma fatia tática de marcação a mercado, em vez de concentrar tudo em um único vencimento.`,`Uma alocação de referência para 8 títulos/lotes combina 2 títulos curtos, 3 longos, 2 com juros semestrais e 1 tático, equilibrando previsibilidade de curto prazo, ganho travado de longo prazo, renda recorrente e potencial de valorização antecipada.`],blocos:[{titulo:`Exemplos por estratégia/vencimento (ilustrativo — títulos e taxas mudam com frequência, não é recomendação de compra)`,itens:[{nome:`Prefixado Curto Prazo (1 a 3 anos) — 25%`,detalhe:`Tesouro Prefixado 2027 e Tesouro Prefixado 2028 — trava uma taxa fixa (ex.: 11% a 12% a.a.) sem expor o capital a oscilações longas. Ideal para metas com data marcada, como viagens, troca de carro ou aportes futuros.`,cor:`var(--sector-pre-curto)`},{nome:`Prefixado Longo Prazo (5 a 10 anos) — 40%`,detalhe:`Tesouro Prefixado 2031, Tesouro Prefixado 2033 e Tesouro Prefixado 2035 — excelentes para travar taxas altas no topo do ciclo de juros e carregar a rentabilidade acumulada por muitos anos.`,cor:`var(--sector-pre-longo)`},{nome:`Com Juros Semestrais (NTN-F) — 25%`,detalhe:`Tesouro Prefixado com Juros Semestrais 2033 e Tesouro Prefixado com Juros Semestrais 2035 — pagam cupons de rendimento a cada 6 meses (fevereiro e agosto), ideais para quem quer receber renda recorrente sem precisar vender o título.`,cor:`var(--sector-pre-semestral)`},{nome:`Marcação a Mercado (Tática) — 10%`,detalhe:`Tesouro Prefixado 2035, sem cupons e de vencimento longo — o mais sensível às variações dos juros futuros, usado para venda antecipada e ganho de capital quando os juros futuros caem.`,cor:`var(--sector-pre-marcacao)`}]}],atencao:`Diferente do Tesouro Selic, o Prefixado pode valer menos do que você pagou se for vendido antes do vencimento em um cenário de alta de juros. Os nomes e vencimentos acima são exemplos ilustrativos para explicar a lógica de diversificação por estratégia — não são uma recomendação de compra; confira sempre as taxas e os vencimentos disponíveis no Tesouro Direto antes de decidir. Fique atento também ao risco de inflação: se a inflação disparar acima da taxa fixa contratada, o ganho real pode ser corroído ou ficar negativo.`,setores:[{label:`Prefixado Curto Prazo (1 a 3 anos)`,pct:25,cor:`var(--sector-pre-curto)`,fundos:2,unidade:`titulo`,funcao:`Previsibilidade e segurança de médio prazo — garante uma taxa fixa para metas com data marcada (viagens, trocas de carro, aportes futuros).`},{label:`Prefixado Longo Prazo (5 a 10 anos)`,pct:40,cor:`var(--sector-pre-longo)`,fundos:3,unidade:`titulo`,funcao:`Maximizar o ganho em ciclos de queda de juros — trava rentabilidades elevadas durante períodos em que a Selic está no topo do ciclo.`},{label:`Com Juros Semestrais (NTN-F)`,pct:25,cor:`var(--sector-pre-semestral)`,fundos:2,unidade:`titulo`,funcao:`Geração de renda recorrente — paga cupons de rendimento a cada 6 meses, ideal para quem busca complementar a renda passiva sem vender o título.`},{label:`Marcação a Mercado (Tática)`,pct:10,cor:`var(--sector-pre-marcacao)`,fundos:1,unidade:`titulo`,funcao:`Busca por ganho de capital antecipado — venda do título antes do vencimento quando os juros futuros caem e o preço do título sobe.`}],notaSetores:`Diversificar no Tesouro Prefixado significa combinar diferentes vencimentos e formas de uso do mesmo título público: previsibilidade de curto prazo, ganho travado no topo do ciclo de juros no longo prazo, fluxo de caixa semestral via NTN-F e potencial de valorização antecipada com a venda tática de títulos longos — sem depender de um único vencimento para toda a fatia de renda fixa prefixada da carteira.`},it={tesouroSelic:nt,tesouroIPCA:{contexto:`O Tesouro Direto reúne os três títulos públicos mais usados numa carteira: o Selic (pós-fixado, liquidez diária), o Prefixado (taxa fixa conhecida na compra) e o IPCA+ (protege o poder de compra, combinando juro fixo com a inflação). Assim como nas Ações, FIIs e BDRs, o principal risco a controlar aqui não é escolher "o título certo", e sim montar os 10 ativos certos dentro de cada tipo, respeitando a data em que você vai precisar do dinheiro.`,criterios:[`Combine a data de vencimento do título com a data em que você realmente vai precisar do dinheiro — vender antes do vencimento de um título prefixado ou IPCA+ expõe você à "marcação a mercado" (o preço sobe e desce com os juros futuros, podendo gerar perda mesmo num título do governo).`,`Compare a taxa real (acima da inflação) do IPCA+ ou a taxa nominal do Prefixado oferecida em vencimentos diferentes — geralmente vencimentos mais longos pagam uma taxa maior, mas oscilam mais até o vencimento.`,`O objetivo do dinheiro define o tipo certo: Selic para a reserva de emergência e o curto prazo, Prefixado para uma meta com data e valor já conhecidos, e IPCA+ para objetivos de longuíssimo prazo como aposentadoria, onde proteger o poder de compra importa mais do que a taxa nominal.`,`Para objetivos de muito longo prazo (aposentadoria, 10+ anos), prefira os títulos IPCA+ sem cupom — todo o rendimento é reinvestido automaticamente, maximizando o efeito dos juros compostos reais, sem o desconto do IR a cada rolagem.`,`Uma alocação de referência para 10 títulos/lotes é 10% por posição — escalone os vencimentos dentro de cada tipo (em vez de comprar tudo na mesma data) para reduzir o risco de reinvestir tudo num único momento da curva de juros.`],blocos:[],atencao:`Se você vender um título Prefixado ou IPCA+ antes do vencimento em um momento de alta nos juros futuros, o preço do título pode ter caído — isso é normal e esperado, mas surpreende quem não conhece a marcação a mercado. O Tesouro Selic não sofre esse efeito, por isso é o tipo indicado para a reserva de emergência. Taxas e vencimentos disponíveis mudam com frequência; confira sempre os números atualizados no Tesouro Direto antes de decidir.`,composicaoPorTipo:{titulo:`Percentual por tipo de Tesouro Direto`,tipos:[{chave:`tesouroIPCA`,label:`IPCA+`,tituloObjetivos:`Qual é o seu objetivo com o Tesouro IPCA+?`,objetivos:[{id:`aposentadoria`,label:`Aposentadoria`,resumo:`Foco em maximizar o efeito dos juros compostos reais ao longo de décadas: a maior fatia fica em vencimentos longuíssimos sem cupom, com uma parcela menor em vencimentos mais próximos para começar a servir de ponte quando a aposentadoria se aproximar.`,setores:[{label:`Vencimento Longuíssimo (Sem Cupom)`,pct:55,cor:`var(--sector-ipca-apo-longuissimo)`,fundos:4,unidade:`titulo`,funcao:`Maximiza o efeito dos juros compostos reais ao longo de décadas — o rendimento é reinvestido automaticamente até o vencimento, sem o desconto do IR a cada cupom.`},{label:`Vencimento Longo (Sem Cupom)`,pct:30,cor:`var(--sector-ipca-apo-longo)`,fundos:3,unidade:`titulo`,funcao:`Vencimento intermediário dentro da estratégia — ainda décadas de reinvestimento automático pela frente, mas já começa a amadurecer perto do período em que a aposentadoria se torna mais concreta.`},{label:`Vencimento Intermediário (Sem Cupom)`,pct:15,cor:`var(--sector-ipca-apo-medio)`,fundos:1,unidade:`titulo`,funcao:`Vencimento mais próximo da estratégia — a primeira fatia a virar liquidez quando a aposentadoria se aproximar, servindo de ponte para o início do usufruto.`}],blocos:[{titulo:`Exemplos por vencimento (ilustrativo — títulos e taxas mudam com frequência, não é recomendação de compra)`,itens:[{nome:`Vencimento Longuíssimo (Sem Cupom) — 55%`,detalhe:`Tesouro IPCA+ 2040, Tesouro IPCA+ 2045, Tesouro IPCA+ 2048 e Tesouro IPCA+ 2050 — os vencimentos mais longos disponíveis no Tesouro Direto. Ideal para quem ainda tem décadas até a aposentadoria e quer priorizar o efeito bola de neve dos juros reais.`,cor:`var(--sector-ipca-apo-longuissimo)`},{nome:`Vencimento Longo (Sem Cupom) — 30%`,detalhe:`Tesouro IPCA+ 2029, Tesouro IPCA+ 2032 e Tesouro IPCA+ 2035 — vencimentos escalonados para reduzir o risco de reinvestir tudo num único momento da curva de juros real. Ideal para quem está a 10-15 anos da aposentadoria.`,cor:`var(--sector-ipca-apo-longo)`},{nome:`Vencimento Intermediário (Sem Cupom) — 15%`,detalhe:`Tesouro IPCA+ 2027 — vencimento mais curto dentro da estratégia de aposentadoria. Ideal para quem está a menos de 5 anos de começar a usar parte do patrimônio.`,cor:`var(--sector-ipca-apo-medio)`}]}],notaSetores:`Para aposentadoria, priorizar títulos IPCA+ sem cupom é o que faz a diferença: cada cupom semestral recebido antecipadamente sofre desconto de Imposto de Renda e perde parte do efeito bola de neve dos juros compostos. Uma carteira de referência com 8 títulos, escalonados entre 2027 e 2050, evita concentrar tudo numa única data e cria uma transição natural conforme a aposentadoria se aproxima.`},{id:`educacao`,label:`Educação`,resumo:`Vencimentos calibrados para coincidir com a data em que o dinheiro vai ser usado (início da faculdade ou curso), com uma pequena fatia de juros semestrais para começar a gerar caixa assim que as primeiras despesas surgirem.`,setores:[{label:`Vencimento Alvo (Sem Cupom)`,pct:60,cor:`var(--sector-ipca-edu-alvo)`,fundos:4,unidade:`titulo`,funcao:`Vencimento calibrado para coincidir com o início do curso ou faculdade — sem cupom, para reinvestir tudo até a data em que o dinheiro será efetivamente usado.`},{label:`Vencimento Intermediário (Sem Cupom)`,pct:25,cor:`var(--sector-ipca-edu-intermediario)`,fundos:3,unidade:`titulo`,funcao:`Fatia intermediária, pensada para reforçar os anos seguintes do curso enquanto o restante da estratégia continua rendendo até os vencimentos mais distantes.`},{label:`Com Juros Semestrais (Início do Uso)`,pct:15,cor:`var(--sector-ipca-edu-semestral)`,fundos:1,unidade:`titulo`,funcao:`Paga cupons a cada 6 meses — útil para complementar mensalidades ou despesas correntes assim que o curso começa, sem precisar vender o título principal.`}],blocos:[{titulo:`Exemplos por vencimento (ilustrativo — títulos e taxas mudam com frequência, não é recomendação de compra)`,itens:[{nome:`Vencimento Alvo (Sem Cupom) — 60%`,detalhe:`Tesouro IPCA+ 2031, Tesouro IPCA+ 2032, Tesouro IPCA+ 2033 e Tesouro IPCA+ 2034 — vencimentos escalonados para cobrir, ano a ano, os primeiros anos de faculdade ou curso. Ideal para quem já sabe a data aproximada de início.`,cor:`var(--sector-ipca-edu-alvo)`},{nome:`Vencimento Intermediário (Sem Cupom) — 25%`,detalhe:`Tesouro IPCA+ 2035, Tesouro IPCA+ 2036 e Tesouro IPCA+ 2037 — cobrem os anos finais do curso, mantendo o rendimento protegido da inflação até bem perto da data de uso. Ideal para completar a faculdade sem precisar vender títulos antes do vencimento.`,cor:`var(--sector-ipca-edu-intermediario)`},{nome:`Com Juros Semestrais (Início do Uso) — 15%`,detalhe:`Tesouro IPCA+ com Juros Semestrais 2033 — gera renda recorrente a partir do início do curso, complementando o caixa mês a mês. Ideal para quem quer folga de liquidez logo nos primeiros anos.`,cor:`var(--sector-ipca-edu-semestral)`}]}],notaSetores:`Diferente da aposentadoria, aqui a data de vencimento importa mais do que maximizar o efeito bola de neve: os títulos principais (2031 a 2034) devem coincidir com o início do curso, para evitar vender antes do vencimento e correr risco de marcação a mercado justamente na hora de usar o dinheiro. Uma carteira de referência com 8 títulos escalonados ano a ano cobre o curso inteiro sem depender de um único vencimento.`},{id:`renda-passiva`,label:`Renda Passiva`,resumo:`Concentra a maior parte da carteira em títulos com juros semestrais, que pagam cupons de rendimento a cada 6 meses sem precisar vender o título, com uma fatia menor sem cupom para reforçar o caixa quando as taxas estiverem atrativas.`,setores:[{label:`Com Juros Semestrais (Vencimento Mais Próximo)`,pct:45,cor:`var(--sector-ipca-renda-semestral-curto)`,fundos:4,unidade:`titulo`,funcao:`Espinha dorsal da renda passiva — paga cupons a cada 6 meses com proteção contra a inflação, sem precisar vender o título.`},{label:`Com Juros Semestrais (Vencimento Mais Longo)`,pct:30,cor:`var(--sector-ipca-renda-semestral-longo)`,fundos:3,unidade:`titulo`,funcao:`Mesmo formato de cupons semestrais, mas com vencimento bem mais longo — ajuda a sustentar a renda passiva por mais décadas, sem depender de reinvestimento no meio do caminho.`},{label:`Sem Cupom (Reforço Futuro)`,pct:25,cor:`var(--sector-ipca-renda-reserva)`,fundos:1,unidade:`titulo`,funcao:`Pequena reserva sem cupom — pode ser levada ao vencimento para reforçar a renda futura ou realocada quando surgirem taxas mais atrativas no mercado.`}],blocos:[{titulo:`Exemplos por vencimento (ilustrativo — títulos e taxas mudam com frequência, não é recomendação de compra)`,itens:[{nome:`Com Juros Semestrais (Vencimento Mais Próximo) — 45%`,detalhe:`Tesouro IPCA+ com Juros Semestrais 2029, 2031, 2033 e 2035 — vencimentos escalonados que já geram um fluxo de cupons semestrais nos próximos anos. Ideal para quem quer complementar a renda no curto/médio prazo.`,cor:`var(--sector-ipca-renda-semestral-curto)`},{nome:`Com Juros Semestrais (Vencimento Mais Longo) — 30%`,detalhe:`Tesouro IPCA+ com Juros Semestrais 2040, 2045 e 2050 — garantem cupons de renda protegidos da inflação por décadas. Ideal para quem quer manter o fluxo de renda passiva por muito tempo, sem se preocupar em recomprar títulos.`,cor:`var(--sector-ipca-renda-semestral-longo)`},{nome:`Sem Cupom (Reforço Futuro) — 25%`,detalhe:`Tesouro IPCA+ 2032 — cresce sem o desconto de IR a cada cupom, funcionando como reserva de valorização para reforçar a renda mais à frente ou aproveitar boas taxas de reinvestimento.`,cor:`var(--sector-ipca-renda-reserva)`}]}],notaSetores:`Os cupons semestrais dos títulos "com Juros Semestrais" sofrem desconto de Imposto de Renda a cada pagamento (tabela regressiva) — por isso, mesmo buscando renda, vale manter uma fatia sem cupom: ela cresce sem esse desconto intermediário e pode ser convertida em renda no momento mais conveniente. No total, uma carteira de referência de 8 títulos equilibra fluxo de caixa recorrente com reforço de longo prazo.`}]},{chave:`tesouroPrefixado`,label:`Prefixado`,setores:rt.setores,blocos:rt.blocos,notaSetores:rt.notaSetores},{chave:`tesouroSelic`,label:`Selic`,setores:nt.setores,blocos:nt.blocos,notaSetores:nt.notaSetores}]}},tesouroPrefixado:rt,cdbLiquidez:{contexto:`CDB é um empréstimo que você faz a um banco, geralmente coberto pelo FGC até R$ 250 mil — um título de renda fixa emitido para captar recursos. Por isso, a lógica de diversificação aqui não busca setores da economia, e sim equilibrar indexadores (tipos de rentabilidade), prazos de resgate (liquidez) e a saúde dos bancos emissores.`,criterios:[`Use a mesma régua de diversificação aplicada às Ações, aos FIIs e aos BDRs — mas trocando "setor" por indexador: espalhe a carteira entre pós-fixado (CDI), IPCA+ e prefixado, em vez de concentrar tudo num único tipo de rentabilidade.`,`Combine prazos diferentes: uma parte com liquidez diária para emergências, outra travada em médio/longo prazo para captar taxas melhores.`,`Confirme o rating de crédito do banco emissor (agências como Moody's, Fitch ou S&P), especialmente em CDBs de bancos médios sem liquidez diária.`,`A regra de ouro do FGC: nunca ultrapasse R$ 250 mil no mesmo banco (somando o valor aplicado + o rendimento futuro) — esse é o limite de cobertura por CPF e por instituição, com teto global de R$ 1 milhão a cada 4 anos.`,`Uma alocação de referência para 10 CDBs é 10% por título, combinando liquidez de curto prazo, proteção contra a inflação e aposta na queda dos juros.`],blocos:[{titulo:`A Regra de Ouro: o limite do FGC`,itens:[{nome:`Nunca ultrapasse R$ 250 mil por banco`,detalhe:`Some o valor aplicado + o rendimento futuro esperado — esse é o teto de cobertura do FGC por CPF e por instituição financeira, com limite global de R$ 1 milhão a cada 4 anos.`},{nome:`Se o banco emissor quebrar`,detalhe:`O FGC devolve o valor aplicado e os juros acumulados até a data da intervenção — mas só até o limite de R$ 250 mil por instituição. Por isso a diversificação entre bancos é a verdadeira proteção, não a escolha de "um bom CDB".`}]},{titulo:`O que comparar entre bancos`,itens:[{nome:`Bancos grandes (Itaú, Bradesco, Banco do Brasil, BTG)`,detalhe:`Mais segurança percebida e boa liquidez diária, mas rentabilidade geralmente mais próxima de 100% do CDI.`},{nome:`Bancos médios/digitais`,detalhe:`Costumam pagar mais que os grandes bancos de varejo pelo mesmo CDB (acima de 100–115% do CDI ou IPCA+ elevado), usando o FGC como proteção ao investidor.`},{nome:`Corretoras de investimento`,detalhe:`Plataformas como as grandes corretoras independentes reúnem CDBs de várias emissoras para comparar taxas, prazos e indexadores num só lugar.`}]},{titulo:`Exemplos por categoria e emissor (ilustrativo — taxas mudam com frequência, não é recomendação de compra)`,itens:[{nome:`Pós-Fixados (Liquidez Diária) — 30%`,detalhe:`CDB Itaú (100% do CDI), CDB BTG Pactual (100% a 102% do CDI) e CDB Sofisa Direto (110% do CDI com liquidez) — 3 títulos. Os "bancões" garantem resgate no mesmo dia; bancos médios pagam um percentual levemente maior pela mesma liquidez.`,cor:`var(--sector-cdb-posfixado)`},{nome:`Atrelados à Inflação (IPCA+) — 40%`,detalhe:`CDB Banco Daycoval (IPCA + 6,2% a.a.), Banco Pine (IPCA + 6,5% a.a.), Banco Fibra (IPCA + 6,7% a.a.) e Banco ABC Brasil (IPCA + 6,0% a.a.) — 4 títulos. Prazos geralmente entre 2 e 5 anos, garantindo ganho real acima da inflação do período.`,cor:`var(--sector-cdb-ipca)`},{nome:`Pré-Fixados (Taxa Fixa) — 20%`,detalhe:`CDB Banco Master (13,2% a.a.) e Banco Pan (12,2% a.a.) — 2 títulos. Trava o rendimento do início ao fim do contrato — vantajoso quando a expectativa é de queda da Selic.`,cor:`var(--sector-cdb-prefixado)`},{nome:`Oportunidade / High Yield — 10%`,detalhe:`CDB Banco Voiter (118% do CDI) — 1 título. Emitido por instituição de menor porte que paga mais para captar recursos — use com moderação e sempre dentro do limite de R$ 250 mil do FGC por banco.`,cor:`var(--sector-cdb-highyield)`}]}],atencao:`CDB com liquidez diária tende a pagar menos que um CDB com carência — a diferença é o preço da flexibilidade. Os nomes, percentuais e taxas acima são exemplos ilustrativos para explicar a lógica de diversificação por indexador e emissor — não são uma recomendação de compra. Taxas de CDBs mudam com frequência e variam por corretora; confira sempre as condições atualizadas antes de decidir, e nunca ultrapasse R$ 250 mil por banco (capital + juros) para manter a cobertura total do FGC.`,setores:[{label:`Pós-Fixados (CDI) - Curto Prazo / Liquidez`,pct:30,cor:`var(--sector-cdb-posfixado)`,fundos:3,unidade:`cdb`,funcao:`Reserva de emergência e oportunidade. Rentabilidade colada na Selic, com resgate diário em grandes bancos (Itaú, Bradesco, Banco do Brasil, BTG).`},{label:`Atrelados à Inflação (IPCA + Taxa)`,pct:40,cor:`var(--sector-cdb-ipca)`,fundos:4,unidade:`cdb`,funcao:`Proteção do poder de compra no médio/longo prazo, com ganho real acima da inflação. Prazos entre 2 e 5 anos, em bancos médios/consolidados.`},{label:`Pré-Fixados (Taxa Fixa)`,pct:20,cor:`var(--sector-cdb-prefixado)`,fundos:2,unidade:`cdb`,funcao:`Aposta na queda dos juros — trava uma rentabilidade alta e fixa para quando a Selic começar a cair. Prazos de 1 a 3 anos.`},{label:`Oportunidade / High Yield (Bancos Médios)`,pct:10,cor:`var(--sector-cdb-highyield)`,fundos:1,unidade:`cdb`,funcao:`Busca por rentabilidades acima de 115% do CDI ou IPCA+ elevado, emitidos por bancos de maior risco, usando o FGC como proteção.`}],notaSetores:`Diversificar em CDBs significa distribuir os recursos entre diferentes emissores bancários, prazos de vencimento e indexadores (CDI, IPCA e taxas fixas), garantindo acesso rápido ao dinheiro para emergências, proteção real contra a inflação no longo prazo e rentabilidade elevada — tudo isso blindado pela garantia do FGC dentro dos limites de segurança por banco (R$ 250 mil por CPF e por instituição).`},lciLca:{contexto:`LCI e LCA são títulos de renda fixa emitidos por bancos — não por securitizadoras — para captar recursos exclusivamente para os setores Imobiliário e do Agronegócio. Diferente do CDB, que pode ser usado para qualquer finalidade do banco, aqui a destinação do dinheiro é regulada. A grande vantagem é a isenção total de Imposto de Renda para pessoa física somada à cobertura do FGC até R$ 250 mil por CPF e por instituição — o que costuma deixar o rendimento líquido acima de um CDB equivalente. Em troca, quase sempre há um prazo de carência mínimo antes do primeiro resgate, então a lógica de diversificação aqui não é "setor da economia", e sim indexador, prazo de carência e a saúde do banco emissor.`,criterios:[`Use a mesma régua de diversificação do CDB — espalhe entre pós-fixado (% do CDI), IPCA+ e prefixado — mas lembre que aqui o dinheiro fica preso até o fim da carência regulatória (normalmente de 9 a 36 meses, dependendo do título e do indexador).`,`Para saber se a isenção de IR compensa mais que um CDB tributável equivalente, calcule a taxa equivalente: Taxa Equivalente CDB = Taxa da LCI/LCA ÷ (1 − alíquota do IR). Uma LCA a 90% do CDI, por exemplo, equivale a um CDB de aproximadamente 105,9% do CDI depois do IR.`,`Confirme sempre o rating de crédito do banco emissor — bancos médios pagam mais (95% a 98% do CDI, ou IPCA+ mais alto) justamente para compensar um risco de crédito maior, ainda coberto pelo FGC dentro do limite.`,`A regra de ouro do FGC vale igual à do CDB: nunca ultrapasse R$ 250 mil por banco (aplicação + rendimento), com teto global de R$ 1 milhão a cada 4 anos.`,`Só aloque em LCI/LCA o dinheiro que você tem certeza de não precisar antes do fim da carência — diferente do CDB com liquidez diária, aqui não há saída antecipada na maioria dos títulos.`],blocos:[{titulo:`Carência regulatória: o que muda entre LCI e LCA`,itens:[{nome:`LCI (Imobiliário)`,detalhe:`Prazo mínimo de carência costuma ser mais longo — normalmente a partir de 36 meses quando não há mercado secundário ativo para o título.`},{nome:`LCA (Agronegócio)`,detalhe:`Prazo mínimo de carência costuma ser mais curto — entre 9 e 36 meses, variando com a estrutura de atualização do índice (pós-fixado, IPCA ou prefixado).`}]},{titulo:`Exemplos por bloco de risco e indexador (ilustrativo — taxas e emissores mudam com frequência, não é recomendação de compra)`,itens:[{nome:`Bancos Consolidados (Pós-Fixado) — 40%`,detalhe:`LCI Banco do Brasil, LCA Itaú, LCI Bradesco e LCA CAIXA, todos entre 90% e 92% do CDI — 4 títulos. Risco de crédito mínimo, com isenção fiscal total e sem come-cotas.`,cor:`var(--sector-lcilca-posfixado)`},{nome:`Bancos Médios (Pós-Fixado Turbinado) — 30%`,detalhe:`LCI Banco Inter (96% do CDI), LCA Banco Daycoval (97% do CDI) e LCI Banco BTG Pactual (95% do CDI) — 3 títulos. Prêmio maior sobre o CDI para compensar um risco de crédito levemente superior, ainda dentro do limite do FGC.`,cor:`var(--sector-lcilca-posfixado)`},{nome:`Inflação (IPCA+) — 20%`,detalhe:`LCI IPCA + 5,8% a.a. e LCA IPCA + 6,0% a.a., em bancos médios — 2 títulos. Ganho real isento de IR, indicado para horizontes de 1 a 3 anos.`,cor:`var(--sector-lcilca-ipca)`},{nome:`Prefixada — 10%`,detalhe:`LCI Prefixada 11,8% a.a. — 1 título. Rentabilidade travada no momento da aplicação, vantajosa quando a expectativa é de queda acelerada da Selic.`,cor:`var(--sector-lcilca-prefixado)`}]}],atencao:`LCI e LCA quase sempre têm carência mínima antes do primeiro resgate (9 a 36 meses conforme o título) — diferente do CDB com liquidez diária, o dinheiro fica indisponível nesse período mesmo em caso de emergência. Os nomes, bancos e taxas acima são exemplos ilustrativos para explicar a lógica de diversificação por indexador e emissor — não são uma recomendação de compra. Confira sempre as condições atualizadas na sua corretora, e nunca ultrapasse R$ 250 mil por banco (capital + juros) para manter a cobertura total do FGC.`,setores:[{label:`Pós-Fixada (% do CDI)`,pct:70,cor:`var(--sector-lcilca-posfixado)`,fundos:7,unidade:`lci`,funcao:`Captura ciclos de juros altos com isenção fiscal total — combina bancos consolidados (menor prêmio, menor risco) e bancos médios (prêmio maior sobre o CDI).`},{label:`Inflação (IPCA + Taxa)`,pct:20,cor:`var(--sector-lcilca-ipca)`,fundos:2,unidade:`lci`,funcao:`Proteção real contra a inflação para horizontes de médio prazo (1 a 3 anos), com ganho isento de IR.`},{label:`Prefixada (Taxa Fixa)`,pct:10,cor:`var(--sector-lcilca-prefixado)`,fundos:1,unidade:`lci`,funcao:`Garantia de fluxo previsível quando a expectativa é de queda acelerada da Selic — rentabilidade travada na contratação.`}],notaSetores:`A inclusão de LCI e LCA na carteira preenche a lacuna de renda fixa privada com isenção total de Imposto de Renda e cobertura do FGC — uma ferramenta para superar a rentabilidade líquida de CDBs tradicionais em prazos de médio prazo, desde que a necessidade de liquidez imediata seja respeitada por conta da carência mínima.`},fiis:{contexto:`Fundos listados em bolsa que investem em imóveis físicos (galpões, shoppings, lajes corporativas — os "FIIs de tijolo") ou em recebíveis imobiliários, como CRIs ("FIIs de papel"). Distribuem renda mensal, isenta de IR para pessoa física, com risco moderado.`,criterios:[`P/VP (preço sobre valor patrimonial): abaixo de 1,0x pode indicar desconto, mas verifique se o motivo não é um problema estrutural do fundo.`,`Dividend Yield (DY) dos últimos 12 meses: compare com a média do setor do fundo, não com o mercado todo.`,`Vacância (para FIIs de tijolo): fundos com vacância baixa e contratos longos tendem a ter renda mais previsível.`,`Diversifique entre "tijolo" (logística, shoppings, lajes corporativas) e "papel" (CRIs) para equilibrar previsibilidade e sensibilidade a juros.`],blocos:[{titulo:`Exemplos por segmento (ilustrativo — vários fundos por segmento, não é indicação de nenhum específico)`,itens:[{nome:`Papel / CRIs`,detalhe:`KNCR11, MXRF11, CPTS11 — recebíveis atrelados a CDI ou IPCA, com rendimento mensal previsível e baixa oscilação de preço.`,cor:`var(--sector-papel)`},{nome:`Galpões Logísticos`,detalhe:`HGLG11, BTLG11, XPLG11 — galpões arrendados a operações de e-commerce e indústria, setor beneficiado pelo crescimento do varejo online.`,cor:`var(--sector-logistica)`},{nome:`Shopping Centers`,detalhe:`XPML11, VISC11, HGBS11 — renda ligada ao consumo e ao varejo físico, incluindo aluguel variável em datas de pico.`,cor:`var(--sector-shopping)`},{nome:`Renda Urbana / Varejo`,detalhe:`HGRU11, TRXF11 — contratos atípicos e de longo prazo com inquilinos essenciais, como supermercados e farmácias.`,cor:`var(--sector-rendaurbana)`},{nome:`Fiagros (Agronegócio)`,detalhe:`SNAG11, RZAG11, KNCA11, VGIA11 — crédito e recebíveis ligados ao agronegócio brasileiro. Tecnicamente são Fiagros, não FIIs — seguem lógica parecida (renda mensal isenta de IR, negociados em bolsa), mas são outro tipo de fundo.`,cor:`var(--sector-fiagro)`},{nome:`FOFs / Multiestratégia`,detalhe:`BCFF11, RBRF11 — carteiras formadas por cotas de outros FIIs, com gestão ativa comprando e vendendo no mercado secundário.`,cor:`var(--sector-multi)`},{nome:`Lajes Corporativas`,detalhe:`PVBI11, BRCR11, RCRB11 — escritórios de alto padrão (Prime/AAA), sensíveis à demanda por espaço corporativo.`,cor:`var(--sector-lajes)`},{nome:`Hospital / Saúde`,detalhe:`NSLU11, HCRI11, NVHO11 — hospitais com contratos atípicos de longuíssimo prazo, setor defensivo com baixíssimo risco de vacância.`,cor:`var(--sector-saude)`},{nome:`Energia / Infraestrutura`,detalhe:`SNEL11 — usinas fotovoltaicas de geração distribuída. Diferente dos outros segmentos, esse ainda é um nicho recente e concentrado: hoje é praticamente o único fundo relevante desse tipo na B3, então a diversificação dentro do próprio segmento é mais limitada.`,cor:`var(--sector-energia)`}]}],atencao:`Um DY muito acima da média do segmento pode ser "dividend trap": o fundo está distribuindo mais do que sua geração de caixa sustenta.`,setores:[{label:`Papel / CRIs`,pct:25,cor:`var(--sector-papel)`,fundos:5,funcao:`Renda mensal previsível e proteção contra inflação/CDI.`},{label:`Galpões Logísticos`,pct:20,cor:`var(--sector-logistica)`,fundos:4,funcao:`Resiliência operacional, com contratos atípicos junto a grandes indústrias e players de e-commerce.`},{label:`Shopping Centers`,pct:10,cor:`var(--sector-shopping)`,fundos:2,funcao:`Proteção real e ganho direto ligado ao consumo, incluindo datas comemorativas.`},{label:`Renda Urbana / Varejo`,pct:10,cor:`var(--sector-rendaurbana)`,fundos:2,funcao:`Inquilinos essenciais (supermercados e farmácias) com contratos longos.`},{label:`Fiagros (Agronegócio)`,pct:10,cor:`var(--sector-fiagro)`,fundos:2,funcao:`Exposição direta ao crédito e aos imóveis do agronegócio brasileiro.`},{label:`FOFs / Multiestratégia`,pct:10,cor:`var(--sector-multi)`,fundos:2,funcao:`Gestão ativa para captura de oportunidades no mercado secundário.`},{label:`Lajes Corporativas`,pct:5,cor:`var(--sector-lajes)`,fundos:1,funcao:`Edifícios empresariais nos principais eixos econômicos (padrão Prime/AAA).`},{label:`Hospital / Saúde`,pct:5,cor:`var(--sector-saude)`,fundos:1,funcao:`Setor ultra-defensivo, com contratos atípicos e baixíssimo risco de vacância.`},{label:`Energia / Infraestrutura`,pct:5,cor:`var(--sector-energia)`,fundos:1,funcao:`Fluxo de caixa previsível, lastreado em contratos de concessão e transmissão.`}],notaSetores:`Diversificar em FIIs significa distribuir o patrimônio entre diferentes tipos de ativos (como imóveis físicos e papéis de dívida) e diversos setores da economia (como galpões, shoppings e agronegócio), reduzindo o risco de perda por vacância, inadimplência ou crises em um segmento específico, o que garante maior previsibilidade de renda mensal e estabilidade no recebimento dos dividendos ao longo do tempo.`},acoesETFs:{contexto:`Participação direta no capital de empresas listadas na B3, comprando a ação de uma companhia específica — a classe com maior potencial de retorno (e de oscilação) da carteira. Assim como nos FIIs, o principal risco a controlar aqui não é escolher "a ação certa", e sim não ficar refém de um único setor da economia.`,criterios:[`Olhe pelo menos três ângulos antes de escolher uma ação: tamanho e liquidez (maiores do Ibovespa), geração de caixa e dividendos, e preço em relação ao patrimônio (P/VP) ou ao lucro (P/L).`,`Dividend yield alto isolado não basta: confira se vem de lucro recorrente ou de um evento pontual (venda de ativo, por exemplo) — isso pode ser um "dividend trap".`,`Use a mesma régua de diversificação aplicada aos FIIs: espalhe a carteira entre vários setores (financeiro, energia, saneamento, commodities, consumo, indústria, seguros) em vez de concentrar em um só ciclo econômico.`,`Se preferir não escolher ações uma a uma, um ETF (ex.: IVVB11, WRLD11) entrega diversificação pronta — veja a análise de Fundos Internacionais/ETFs.`],blocos:[{titulo:`Exemplos por setor (Blue Chips e líderes de mercado — ilustrativo, não é indicação de compra)`,itens:[{nome:`Financeiro / Bancos`,detalhe:`ITUB4 (Itaú), BBAS3 (Banco do Brasil), SANB11 (Santander), BPAC11 (BTG Pactual) — os maiores e mais lucrativos bancos do país. ITUB4/BBAS3 são referências em rentabilidade (ROE) e proventos recorrentes; SANB11/BPAC11 têm forte presença em varejo e banco de investimentos.`,cor:`var(--sector-financeiro)`},{nome:`Energia Elétrica`,detalhe:`ELET3 (Eletrobras), EGIE3 (Engie Brasil), TAEE11 (Taesa), TRPL4 (ISA CTEEP) — o setor de maior previsibilidade na B3. TAEE11/TRPL4 são transmissoras com receita fixa por contrato (RAP); EGIE3/ELET3 são gigantes de geração e comercialização de energia limpa.`,cor:`var(--sector-energia-eletrica)`},{nome:`Saneamento & Serviços`,detalhe:`SBSP3 (Sabesp), CPLE6 (Copel), CSMG3 (Copasa) — monopólios operacionais com contratos essenciais. SBSP3 é a maior empresa de saneamento da América Latina; CPLE6/CSMG3 são concessões estaduais sólidas e pagadoras de dividendos.`,cor:`var(--sector-saneamento)`},{nome:`Commodities / Básicos`,detalhe:`VALE3 (Vale), PETR4 (Petrobras), SUZB3 (Suzano) — exportadoras e líderes mundiais. VALE3 é a maior produtora global de minério de ferro de alta qualidade; PETR4 lidera petróleo e gás no pré-sal; SUZB3 é a maior produtora mundial de celulose de eucalipto.`,cor:`var(--sector-commodities)`},{nome:`Consumo, Varejo & Saúde`,detalhe:`RADL3 (RaiaDrogasil), ABEV3 (Ambev) — demanda perene e escala incomparável. RADL3 é a maior rede de farmácias do Brasil, em expansão constante; ABEV3 lidera bebidas e cervejas na América Latina, com forte caixa livre.`,cor:`var(--sector-consumo-saude)`},{nome:`Indústria & Bens de Capital`,detalhe:`WEGE3 (WEG), POMO4 (Marcopolo) — excelência operacional e presença global. WEGE3 é uma das empresas mais eficientes do mundo na fabricação de motores e soluções elétricas; POMO4 lidera o mercado de carrocerias de ônibus e mobilidade.`,cor:`var(--sector-industria)`},{nome:`Seguros & Holdings`,detalhe:`BBSE3 (BB Seguridade), ITSA4 (Itaúsa) — proteção e geração contínua de caixa. BBSE3 é o braço de seguros e previdência atrelado ao agronegócio e varejo bancário; ITSA4 é uma holding diversificada com forte participação no Banco Itaú.`,cor:`var(--sector-seguros-holding)`}]}],atencao:`Os nomes acima são exemplos para ilustrar os critérios de análise (tamanho, dividendos, valuation) — não é uma recomendação de compra. Cotações, P/VP e dividend yield mudam diariamente; confira dados atualizados antes de decidir.`,setores:[{label:`Financeiro / Bancos`,pct:20,cor:`var(--sector-financeiro)`,fundos:4,unidade:`acao`,funcao:`Os maiores e mais lucrativos bancos do país — referências em rentabilidade (ROE) e proventos recorrentes.`},{label:`Energia Elétrica`,pct:20,cor:`var(--sector-energia-eletrica)`,fundos:4,unidade:`acao`,funcao:`O setor de maior previsibilidade na B3 — transmissoras com receita fixa por contrato e geradoras de energia limpa.`},{label:`Saneamento & Serviços`,pct:15,cor:`var(--sector-saneamento)`,fundos:3,unidade:`acao`,funcao:`Monopólios operacionais com contratos essenciais — concessões estaduais sólidas e pagadoras de dividendos.`},{label:`Commodities / Básicos`,pct:15,cor:`var(--sector-commodities)`,fundos:3,unidade:`acao`,funcao:`Exportadoras e líderes mundiais em minério, petróleo e celulose — dolarizadas e geradoras de caixa em ciclos de alta.`},{label:`Consumo, Varejo & Saúde`,pct:10,cor:`var(--sector-consumo-saude)`,fundos:2,unidade:`acao`,funcao:`Demanda perene e escala incomparável — farmácias e bebidas com forte caixa livre.`},{label:`Indústria & Bens de Capital`,pct:10,cor:`var(--sector-industria)`,fundos:2,unidade:`acao`,funcao:`Excelência operacional e presença global — motores, soluções elétricas e mobilidade.`},{label:`Seguros & Holdings`,pct:10,cor:`var(--sector-seguros-holding)`,fundos:2,unidade:`acao`,funcao:`Proteção e geração contínua de caixa — seguros, previdência e participações societárias.`}],notaSetores:`Diversificar em ações significa distribuir o patrimônio entre empresas e setores que reagem de formas diferentes à economia, o que reduz drasticamente o risco de grandes perdas por problemas específicos de uma única companhia, suaviza as oscilações da carteira em momentos de crise e garante proteção contínua e rendimentos mais estáveis no longo prazo.`},bdrs:{contexto:`Recibos negociados na B3 que representam ações de empresas listadas no exterior (principalmente EUA), com exposição direta à variação do dólar (risco cambial). Permitem investir nas maiores multinacionais do mundo sem precisar abrir conta em corretora internacional. Assim como em Ações e FIIs, o principal risco a controlar aqui não é escolher "o BDR certo", e sim não ficar refém de um único setor ou de um único país.`,criterios:[`Use a mesma régua de diversificação aplicada às Ações e aos FIIs: espalhe a carteira entre vários setores globais (tecnologia, saúde, consumo, financeiro, indústria, energia, mídia) em vez de concentrar tudo em tecnologia.`,`BDRs "patrocinados" (com programa oficial da empresa) costumam ter melhor liquidez do que os "não patrocinados" — prefira sempre os mais líquidos.`,`Você assume risco cambial: o valor do BDR reflete a ação original convertida para reais, então a variação do dólar também afeta o resultado, para cima ou para baixo.`,`Uma alocação de referência para 20 BDRs é 5% por ativo, combinando líderes de peso (Big Techs) com setores mais defensivos (saúde, consumo) para equilibrar crescimento e estabilidade.`],blocos:[{titulo:`Exemplos por setor (tickers na B3 — ilustrativo, não é indicação de compra)`,itens:[{nome:`Big Techs & Inteligência Artificial`,detalhe:`AAPL34 (Apple), MSFT34 (Microsoft), NVDC34 (Nvidia), GOGL34 (Alphabet/Google), AMZO34 (Amazon) — líderes mundiais em tecnologia, nuvem, IA e plataformas digitais, com alta margem e crescimento consistente.`,cor:`var(--sector-bigtechs)`},{nome:`Saúde, Farmacêutica e Biotecnologia`,detalhe:`JNJB34 (Johnson & Johnson), LLLY34 (Eli Lilly), UNHH34 (UnitedHealth Group) — setor defensivo, mais imune a ciclos econômicos, com portfólios diversificados em medicamentos, inovação médica e planos de saúde.`,cor:`var(--sector-saude-global)`},{nome:`Consumo Global & Marcas Fortes`,detalhe:`COCA34 (Coca-Cola), PGCO34 (Procter & Gamble), WALM34 (Walmart) — conglomerados globais de bens de consumo, com marcas consolidadas e alto poder de repasse de preços em qualquer cenário econômico.`,cor:`var(--sector-consumo-global)`},{nome:`Serviços Financeiros & Meios de Pagamento`,detalhe:`VISA34 (Visa), MSCD34 (Mastercard), JPMC34 (JPMorgan Chase) — processadoras de pagamento com margens elevadas e o maior banco dos EUA em ativos, todos lucrando com o volume do comércio mundial.`,cor:`var(--sector-financeiro-global)`},{nome:`Indústria, Defesa e Logística Global`,detalhe:`CATP34 (Caterpillar), LMTB34 (Lockheed Martin) — máquinas pesadas e automação industrial, além de defesa e aeroespacial com contratos governamentais de longo prazo.`,cor:`var(--sector-industria-defesa)`},{nome:`Energia & Commodities Globais`,detalhe:`EXXO34 (ExxonMobil), CVSH34 (Chevron) — petroleiras integradas com forte geração de caixa em dólar e histórico consistente de dividendos.`,cor:`var(--sector-energia-global)`},{nome:`Comunicação, Mídia e Entretenimento`,detalhe:`DISB34 (Disney), NFLX34 (Netflix) — streaming, conteúdo e publicidade digital com alcance global e receita recorrente por assinatura.`,cor:`var(--sector-midia-global)`}]}],atencao:`BDRs somam dois riscos: o da empresa e o cambial (dólar/real) — uma queda da ação no exterior pode ser amplificada ou suavizada pela variação do dólar. Evite concentrar tudo num único setor, como fizeram muitos investidores só em tecnologia nos últimos anos; os nomes acima são exemplos para ilustrar os critérios, não uma recomendação de compra.`,setores:[{label:`Big Techs & Inteligência Artificial`,pct:25,cor:`var(--sector-bigtechs)`,fundos:5,unidade:`bdr`,funcao:`Líderes mundiais em tecnologia, nuvem, IA e plataformas digitais, com alta margem e crescimento.`},{label:`Saúde, Farmacêutica e Biotecnologia`,pct:15,cor:`var(--sector-saude-global)`,fundos:3,unidade:`bdr`,funcao:`Setor defensivo, imune a ciclos econômicos, focado em inovação médica e farmacêutica.`},{label:`Consumo Global & Marcas Fortes`,pct:15,cor:`var(--sector-consumo-global)`,fundos:3,unidade:`bdr`,funcao:`Conglomerados globais de consumo com alto poder de repasse de preços e presença planetária.`},{label:`Serviços Financeiros & Meios de Pagamento`,pct:15,cor:`var(--sector-financeiro-global)`,fundos:3,unidade:`bdr`,funcao:`Processadoras de pagamento e gigantes bancárias globais que lucram com o comércio mundial.`},{label:`Indústria, Defesa e Logística Global`,pct:10,cor:`var(--sector-industria-defesa)`,fundos:2,unidade:`bdr`,funcao:`Concessionárias de transporte, aeroespacial, defesa e automação industrial.`},{label:`Energia & Commodities Globais`,pct:10,cor:`var(--sector-energia-global)`,fundos:2,unidade:`bdr`,funcao:`Gigantes do petróleo, gás e transição energética com forte geração de caixa em dólar.`},{label:`Comunicação, Mídia e Entretenimento`,pct:10,cor:`var(--sector-midia-global)`,fundos:2,unidade:`bdr`,funcao:`Plataformas de streaming, conteúdo e publicidade digital.`}],notaSetores:`Diversificar em BDRs significa expor o patrimônio às maiores e mais sólidas empresas globais cotadas em dólar, reduzindo a dependência da economia brasileira e do real, ao mesmo tempo em que equilibra a alta capacidade de crescimento do setor de tecnologia com a estabilidade de gigantes de consumo, saúde e finanças mundiais.`},ouro:{contexto:`Metal usado como reserva de valor há séculos, historicamente descorrelacionado das ações e da renda fixa brasileira. Tende a se valorizar em momentos de forte incerteza global (crises, inflação alta, guerras) — funciona como um "seguro" da carteira, não como o motor de retorno. Assim como em Ações, FIIs e BDRs, o principal risco a controlar aqui não é escolher "o ativo certo", e sim não concentrar tudo numa única forma de acesso — ETF, BDR e fundo têm liquidez, custo e tributação diferentes.`,criterios:[`Ouro não paga dividendos nem juros — não espere renda passiva desse ativo, só proteção e valorização de preço.`,`Uma fatia pequena (5% a 10% da carteira) já costuma ser suficiente para o efeito de proteção, sem pesar demais no retorno em anos de bolsa em alta.`,`Use a mesma régua de diversificação aplicada às Ações, FIIs e BDRs: combine ETFs (negociação simples via Home Broker), BDRs (acesso direto ao maior mercado de ouro do mundo) e fundos (gestão profissional, sem operar na bolsa) em vez de concentrar tudo num único emissor.`,`A maioria dos ativos de ouro soma exposição cambial (dólar/real) à variação do próprio metal — só ETFs com hedge cambial (ex.: que replicam o Índice Futuro de Ouro da B3 combinado a Tesouro Selic) isolam o preço do ouro do efeito do dólar.`,`BDRs de ETFs internacionais mais baratos costumam exigir status de investidor qualificado (mais de R$ 1 milhão investidos ou certificação do mercado financeiro) — confirme o acesso antes de considerar esse ativo na carteira.`],blocos:[{titulo:`Exemplos por forma de acesso (ilustrativo — não é indicação de compra)`,itens:[{nome:`ETFs na B3 — 40%`,detalhe:`GOLD11 e GLDX11 (replicam índices internacionais em dólar, sem hedge cambial); OURO11 e GOLB11 (seguem o Índice Futuro de Ouro da B3, em reais); GOLX11 (com proteção cambial, somando o diferencial de juros Brasil x EUA). Negociação simples em bolsa via Home Broker, com liquidez diária e baixo custo de administração.`,cor:`var(--sector-ouro-etf)`},{nome:`BDRs de ETFs Internacionais — 30%`,detalhe:`IAUM34 e GLDM34 (recibos de ETFs americanos de baixo custo, acesso livre); BIAU39 (iShares Gold Trust, da BlackRock); ABGD39 (Abrdn Physical Gold Shares, taxa mais baixa do grupo, mas restrito a investidores qualificados). Acompanham o maior mercado físico de ouro do mundo, com dupla exposição a ouro e dólar.`,cor:`var(--sector-ouro-bdr)`},{nome:`Fundos de Investimento em Ouro — 30%`,detalhe:`Trend Ouro FIM (mesma gestora do GOLD11, acesso via aplicação de fundo, sem precisar de Home Broker); Vitreo Ouro FIM (taxa de administração baixa, com exposição cambial); BTG Reference Ouro USD FIC FIM (fundo em dólar do BTG Pactual). Gestão profissional e aplicação direto pelo app da corretora.`,cor:`var(--sector-ouro-fundo)`}]}],atencao:`Ouro não paga dividendos nem juros — o retorno depende inteiramente da variação de preço do metal. Fique atento à tributação de cada formato (15% de IR na venda para ETFs/BDRs vs. come-cotas semestral nos fundos), à dupla exposição cambial presente na maioria dos ativos, e ao "risco de base" dos ETFs que seguem o mercado futuro local (OURO11/GOLB11), que pode divergir ligeiramente do preço internacional convertido em reais.`,setores:[{label:`ETFs na B3`,pct:40,cor:`var(--sector-ouro-etf)`,fundos:5,unidade:`etf`,funcao:`Negociação simples em bolsa via Home Broker, com liquidez diária e baixo custo de administração.`},{label:`BDRs de ETFs Internacionais`,pct:30,cor:`var(--sector-ouro-bdr)`,fundos:4,unidade:`bdr`,funcao:`Acesso ao maior mercado físico de ouro do mundo, com dupla exposição a ouro e dólar.`},{label:`Fundos de Investimento em Ouro`,pct:30,cor:`var(--sector-ouro-fundo)`,fundos:3,unidade:`fundo`,funcao:`Gestão profissional e aplicação direto pelo app da corretora, sem precisar operar na bolsa.`}],notaSetores:`Essa divisão em 3 pilares permite capturar liquidez e baixo custo via ETFs na B3, dolarização e escala das maiores gestoras globais (BlackRock, Aberdeen) via BDRs, e conveniência administrativa com a gestão profissional dos fundos — reduzindo o risco de concentrar toda a proteção contra crises num único emissor ou numa única forma de acesso ao metal.`},fundosInternacionais:{contexto:`ETFs (fundos negociados em bolsa que replicam um índice) que dão acesso a bolsas e economias fora do Brasil — a forma mais simples de diversificar geograficamente e se expor ao dólar sem escolher ações uma a uma.`,criterios:[`Comece pelo mais líquido e conhecido: um ETF que replique o S&P 500 (ex.: IVVB11) já dá exposição às maiores empresas dos EUA.`,`Para diversificar além dos EUA, existem ETFs de índices globais (somando países desenvolvidos e emergentes) ou de mercados específicos, como China.`,`Avalie se o custo (taxa de administração) de um ETF mais nichado (um único país ou setor) compensa a diversificação extra frente a um ETF global amplo.`,`O resultado em reais depende de dois fatores: o desempenho do índice no exterior E a variação do dólar frente ao real — os dois podem se somar ou se cancelar.`],blocos:[{titulo:`Formas de acesso`,itens:[{nome:`IVVB11`,detalhe:`Replica o S&P 500 em reais, o principal índice de ações dos EUA (grandes empresas de todos os setores), com exposição cambial ao dólar.`},{nome:`NASD11`,detalhe:`Replica o Nasdaq-100, índice das 100 maiores empresas não financeiras da bolsa Nasdaq (forte concentração em tecnologia, como Apple, Microsoft e Nvidia). Mais concentrado em um setor do que o IVVB11.`},{nome:`WRLD11`,detalhe:`Replica um índice global (FTSE Global All Cap) com milhares de empresas de países desenvolvidos e emergentes — a opção mais diversificada geograficamente, em vez de apostar só nos EUA.`},{nome:`XINA11`,detalhe:`Replica o MSCI China, dando exposição a centenas de empresas chinesas. Mercado específico, mais concentrado e sujeito a riscos regulatórios e políticos próprios da China.`}]}],atencao:`Quanto mais nichado o ETF (um único país ou setor, como XINA11 ou NASD11), maior a concentração de risco — combine com um ETF mais amplo (IVVB11 ou WRLD11) em vez de apostar tudo numa única fatia do mercado internacional.`},cripto:{contexto:`Classe de ativos digitais (Bitcoin, Ethereum e outras criptomoedas) com volatilidade muito acima de ações ou FIIs. Assim como em Ações e BDRs, o principal risco a controlar aqui não é escolher "a moeda certa", e sim não concentrar tudo numa única forma de acesso — fundo, ETF, BDR ou compra direta têm liquidez, custódia e tributação diferentes.`,criterios:[`Trate cripto como uma fatia pequena e satélite da carteira (referência: até 3% do total nos perfis Arrojados) — o objetivo é participar da assimetria de longo prazo sem comprometer o restante do patrimônio numa classe tão volátil.`,`Use a mesma régua de diversificação aplicada às Ações, FIIs e BDRs: espalhe entre diferentes formas de acesso (gestão profissional, passiva via ETF, exposição via BDR e posse direta) em vez de concentrar tudo numa corretora ou num único ativo.`,`Gestão profissional (fundos) e ETFs entregam rebalanceamento automático e dispensam a guarda das chaves privadas; a compra direta (spot) é a única que permite Autocustódia (cold wallet) — cada formato troca conveniência por controle.`,`BDRs de empresas do ecossistema cripto (exchanges como C1OB34, mineradoras como MARA34, ou companhias com Bitcoin em tesouraria) somam o risco cambial e o risco do negócio da empresa ao risco do próprio criptoativo — não é exposição pura ao preço da moeda.`,`Uma alocação de referência para 20 ativos é 5% por posição, combinando gestão profissional, produtos listados na B3 (ETFs e BDRs) e posse direta das moedas mais consolidadas do mercado.`],blocos:[{titulo:`Exemplos por pilar de acesso (ilustrativo — não é indicação de compra)`,itens:[{nome:`Fundos de Investimento Cripto — 30%`,detalhe:`Hashdex 100 e BTG BTC 100 (100% do patrimônio em Bitcoin); QR BTC 100 (fundo de Bitcoin da QR Asset Management, mesma gestora do ETF QBTC11); Hashdex 20 e BTG 20 (só 20% em cripto, 80% em renda fixa — exposição mais suave); Vitreo DeFi (fundo temático em finanças descentralizadas). Gestão profissional, rebalanceamento automático e opções de controle de risco via Renda Fixa.`,cor:`var(--sector-cripto-fundos)`},{nome:`ETFs na B3 — 25%`,detalhe:`HASH11 (cesta diversificada de criptoativos, primeiro ETF cripto do mundo); QBTC11 (primeiro ETF de Bitcoin da América Latina); ETHE11 (100% Ethereum); DEFI11 (cesta de tokens de finanças descentralizadas); WEB311 (plataformas de contratos inteligentes, como Ethereum, Solana e Cardano). Negociação simples em bolsa via Home Broker, cobrindo índices de Bitcoin, Ethereum, DeFi e Web3.`,cor:`var(--sector-cripto-etf)`},{nome:`BDRs da B3 — 25%`,detalhe:`IBIT39 (BDR do ETF de Bitcoin à vista da BlackRock, a maior gestora do mundo); M3TA34, C1OB34, MARA34 e BLOK34 (BDRs de empresas do ecossistema cripto — exchanges, mineradoras e companhias com Bitcoin em tesouraria). Dolarização, escala das maiores gestoras globais e empresas do ecossistema cripto.`,cor:`var(--sector-cripto-bdr)`},{nome:`Compra Direta / Spot — 20%`,detalhe:`BTC (Bitcoin, referência de mercado e reserva de valor digital); ETH (Ethereum, maior rede de contratos inteligentes); SOL (Solana, blockchain de alta velocidade); LINK (Chainlink, rede de oráculos que conecta contratos inteligentes a dados do mundo real). Posse real do ativo e liberdade para transferência a uma Cold Wallet de autocustódia.`,cor:`var(--sector-cripto-spot)`}]}],atencao:`Cripto pode oscilar dezenas de % em poucos dias e não tem garantia do FGC — trate como capital que você aceitaria perder. Corretoras/exchanges também têm risco de contraparte (histórico de calotes e falências no setor); prefira plataformas reguladas e, se optar por Autocustódia, entenda a responsabilidade de guardar sua própria chave privada antes de transferir para uma cold wallet.`,setores:[{label:`Fundos de Investimento Cripto`,pct:30,cor:`var(--sector-cripto-fundos)`,fundos:6,unidade:`fundo`,funcao:`Gestão profissional, rebalanceamento automático e opções de controle de risco via Renda Fixa.`},{label:`ETFs na B3`,pct:25,cor:`var(--sector-cripto-etf)`,fundos:5,unidade:`etf`,funcao:`Negociação simples em bolsa via Home Broker, cobrindo índices de Bitcoin, Ethereum, DeFi e Web3.`},{label:`BDRs da B3`,pct:25,cor:`var(--sector-cripto-bdr)`,fundos:5,unidade:`bdr`,funcao:`Dolarização, escala das maiores gestoras globais (BlackRock) e empresas do ecossistema cripto.`},{label:`Compra Direta (Mercado Spot)`,pct:20,cor:`var(--sector-cripto-spot)`,fundos:4,unidade:`moeda`,funcao:`Posse real do ativo e liberdade para transferência a uma Cold Wallet de autocustódia.`}],notaSetores:`Essa divisão em 4 pilares permite capturar liquidez e diversificação instantânea via ETFs e BDRs de grandes gestoras (como BlackRock e Hashdex), conveniência administrativa com a gestão profissional de fundos, e soberania financeira real ao manter parte do capital em ativos spot diretos (BTC, ETH), prontos para transferência a uma carteira de autocustódia.`}};function at(e,t){return e===`acao`?t===1?`ação`:`ações`:e===`bdr`?t===1?`BDR`:`BDRs`:e===`cdb`?t===1?`CDB`:`CDBs`:e===`etf`?t===1?`ETF`:`ETFs`:e===`moeda`?t===1?`moeda`:`moedas`:e===`titulo`?t===1?`título`:`títulos`:e===`lci`?t===1?`LCI/LCA`:`LCIs/LCAs`:t===1?`fundo`:`fundos`}function ot({ctx:e}){let t=e.ativoSelecionado,n=e.resultado,r=t?it[t]:void 0,[i,a]=(0,l.useState)(new Set),[o,s]=(0,l.useState)(()=>r?.composicaoPorTipo?.tipos[0]?.chave),[c,u]=(0,l.useState
